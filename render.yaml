# Render Blueprint — 웹 서비스 1개.
# DB 는 Render 무료 Postgres(30일 만료) 대신 외부 Postgres(Neon 무료, 만료 없음)를 쓴다.
# DATABASE_URL 은 Render 대시보드 > Environment 에 직접 넣는다(sync: false = 여기서 덮어쓰지 않음).
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: suneung-planner
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TZ
        value: Asia/Seoul
      - key: DATABASE_URL
        sync: false
