# Render Blueprint — 웹 서비스 1개 + PostgreSQL 1개를 한 번에 생성합니다.
# https://render.com/docs/blueprint-spec
databases:
  - name: suneung-planner-db
    databaseName: planner
    user: planner
    plan: free
    region: singapore

services:
  - type: web
    name: suneung-planner
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TZ
        value: Asia/Seoul
      - key: DATABASE_URL
        fromDatabase:
          name: suneung-planner-db
          property: connectionString
